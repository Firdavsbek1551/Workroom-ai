# Render Blueprint (bepul): Dashboard → New → Blueprint → shu repo
# Ma'lumotlar Neon PostgreSQL'da saqlanadi (bepul, muddatsiz) — server qayta ishga tushsa ham o'chmaydi.
services:
  - type: web
    name: workroom-ai
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev || npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL        # Neon → Connect → connection string (postgresql://...)
        sync: false
      - key: SUPER_ADMIN_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TURN_URL
        sync: false
      - key: TURN_USER
        sync: false
      - key: TURN_PASS
        sync: false
