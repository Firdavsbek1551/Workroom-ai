# Render Blueprint — WORKROOM AI
# Render → New → Blueprint → shu repo'ni tanlang.
# ANTHROPIC_API_KEY (ixtiyoriy) — Claude AI; TELEGRAM_BOT_TOKEN (ixtiyoriy) — davomat xabarlari boti (@BotFather).
services:
  - type: web
    name: workroom-ai
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: AI_MODEL
        value: claude-sonnet-5-5
